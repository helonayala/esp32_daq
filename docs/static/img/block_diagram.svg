<svg xmlns="http://www.w3.org/2000/svg" viewBox="-70 0 1010 440" font-family="Helvetica, Arial, sans-serif" role="img"><title>Block diagram: ESP32, output, inputs, ±15 V supply and bench</title><rect x="-70" width="100%" height="100%" fill="white"/>
