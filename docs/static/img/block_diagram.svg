<text x="145.0" y="68" text-anchor="middle" font-size="15" fill="#1b1b1b" font-weight="normal">generated from the 5 V</text>
<rect x="20" y="110" width="250" height="100" rx="8" fill="#fdf0dc" stroke="#b45f06" stroke-width="2.5"/>
<text x="145.0" y="138" text-anchor="middle" font-size="18" fill="#b45f06" font-weight="bold">Output</text>
<text x="145.0" y="164" text-anchor="middle" font-size="15" fill="#1b1b1b" font-weight="normal">PWM → 2 RC → TL072</text>
<text x="145.0" y="182" text-anchor="middle" font-size="15" fill="#1b1b1b" font-weight="normal">Vo = 6.44·Vdac − 10.7 V</text>
