<text x="145.0" y="284" text-anchor="middle" font-size="15" fill="#1b1b1b" font-weight="normal">divider + level shift + clamps</text>
<text x="145.0" y="302" text-anchor="middle" font-size="15" fill="#1b1b1b" font-weight="normal">+ MCP6002 follower</text>
<text x="145.0" y="320" text-anchor="middle" font-size="15" fill="#1b1b1b" font-weight="normal">(±10 V → 0–3.3 V)</text>
